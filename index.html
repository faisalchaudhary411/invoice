<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a"><title>Al Ghani Invoices</title>
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
h1{font-size:1.3rem;margin-bottom:4px;text-align:center}p.sub{color:#94a3b8;font-size:.85rem;margin-bottom:22px;text-align:center}
.grid{display:grid;gap:16px;width:100%;max-width:640px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
a.card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;border-radius:20px;text-decoration:none;color:#fff;border:2px solid transparent;transition:transform .1s}
a.card:active{transform:scale(.97)}
a.card img{height:120px;width:auto;max-width:100%;object-fit:contain}
a.card b{font-size:1.1rem}a.card span{font-size:.8rem;opacity:.85}
.steel{background:linear-gradient(160deg,#0b1b2b,#13304d);border-color:#c9a227}.steel b{color:#e2b93b}
.elec{background:linear-gradient(160deg,#0a2f6b,#1450a8);border-color:#f07c00}.elec b{color:#ffc233}
</style></head><body>
<h1>Al Ghani — Invoice Generator</h1><p class="sub">Choose the business to make an invoice for</p>
<div class="grid">
<a class="card steel" href="steel/"><img src="logo-steel.png" alt=""><b>Al Ghani Steel Arts</b><span>Welding &amp; Steel Fabrication</span></a>
<a class="card elec" href="electric/"><img src="logo-electric.png" alt=""><b>Al Ghani Electric &amp; Hardware</b><span>Electrical &amp; Hardware Store</span></a>
</div></body></html>
